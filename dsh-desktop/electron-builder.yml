# electron-builder 配置 —— 无证书自用（unsigned），仅 arm64
appId: ai.deepseek.dsh.desktop
productName: DeepSeek Harness
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
# 直接使用本机已安装的 Electron（node_modules/electron/dist，版本由 package.json 锁
# 定 43.4.0，与官方 zip 完全同源）：electron-builder 不再从 GitHub Releases 下载
# electron zip，避免网络抖动导致打包失败，构建全程与网络解耦。
electronDist: node_modules/electron/dist
# 自包含 DSH host 包（scripts/bundle-host.mjs 生成）：由 afterPack 钩子
# （scripts/after-pack.cjs）整目录复制到 Resources/host——extraResources 对
# node_modules 有过滤，目录型复制不可靠。
afterPack: ./scripts/after-pack.cjs
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # 无证书自用：identity: null 产出未签名 .app（本机双击可直接运行）
  identity: null
  hardenedRuntime: false
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# GitHub Releases 更新源（D4）：签名/公证后启用，owner/repo 与 package.json repository 保持一致
publish:
  provider: github
  owner: mlzhuo
  repo: dsh-desktop
